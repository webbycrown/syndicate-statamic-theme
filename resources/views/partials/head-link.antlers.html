

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html { background: #f2deba; }
    body { margin: 0; }
    body:not(.is-ready) { overflow: hidden; }
    body:not(.is-ready) > *:not(.preloader) { visibility: hidden !important; }
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      width: 100%;
      height: 100%;
      background: #f2deba;
      overflow: hidden;
    }
    .preloader-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .preloader-icon {
      width: 100px;
      height: 100px;
      display: inline-block;
    }
    .preloader-icon span {
      position: absolute;
      display: inline-block;
      width: 100px;
      height: 100px;
      background: url('/assets/images/loader-icon.png') no-repeat center / 100%;
    }
    .preloader-icon span:last-child {
      background: url('/assets/images/loader-icon-shape.png') no-repeat center / 100%;
      animation: syndicate-preloader-fx 1.6s linear infinite;
    }
    @keyframes syndicate-preloader-fx {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>{{ title ?? site:name }}</title>
  <meta name="title" content="{{ title ?? site:name }}">


 <meta name="description" content="{{ seo_description ?? 'Discover beautiful content and services at ' }}">

  <meta name="csrf-token" content="{{ csrf_token }}">

  <!-- Favicon -->
  {{ setting }}
  {{ favicon }}
  <link rel="icon" href="{{ url }}" type="image/gif">
  {{ /favicon }}
  {{ /setting }}

  <!-- Open Graph / Facebook -->

  <meta name="description" content="{{ seo_description ?? 'Discover beautiful content and services at '}}">
  <meta property="og:title" content="{{ seo_title ?? site:name }}">
  <meta property="og:description" content="{{ seo_description ?? 'Explore services and stories with us.' }}">
  <meta property="twitter:title" content="{{ seo_title ?? site:name }}">
  <meta property="twitter:description" content="{{ seo_description ?? 'Explore services and stories with us.' }}">

 {{ if seo_image }}
    {{ seo_image }}
        <meta property="og:image" content="{{ url }}">
        <meta property="twitter:image" content="{{ url }}">
    {{ /seo_image }}
{{ else }}
    <meta property="og:image" content="/assets/images/logo.svg">
    <meta property="twitter:image" content="/assets/images/logo.svg">
{{ /if }}



  <!-- Canonical -->
  <link rel="canonical" href="{{ current_url }}">

  <link rel="preload" href="/assets/css/bootstrap.min.css" as="style">
  <link rel="preload" href="/assets/css/style.css" as="style">
  <link rel="preload" href="/assets/images/loader-icon.png" as="image">
  <link rel="preload" href="/assets/images/loader-icon-shape.png" as="image">

  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="/assets/css/aos.css">
  <link rel="stylesheet" href="/assets/css/magnific-popup.css">
  <link rel="stylesheet" href="/assets/css/all-fontawesome.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

</head>
